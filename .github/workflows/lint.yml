# Reusable workflow: lint only the files a PR changed -- PHPCS for PHP, ESLint for JS/TS.
# Replaces the per-repo phpcs.yml / pr-code-sniff.yml copies.
#
# Each tool uses the repo's OWN ruleset (phpcs.xml[.dist], .eslintrc* / eslint.config.*),
# so the standard stays owned by the repo, not by this workflow. A repo with no ruleset
# for a tool simply skips that tool.
#
# Consuming repos call it with a short caller -- see lint.caller.yml.
name: Lint

on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version for running PHPCS.'
        type: string
        required: false
        default: '7.4'
      node-version:
        description: 'Node version for running ESLint.'
        type: string
        required: false
        default: '20.x'
      run-phpcs:
        description: 'Set false to skip PHPCS.'
        type: boolean
        required: false
        default: true
      run-eslint:
        description: 'Set false to skip ESLint.'
        type: boolean
        required: false
        default: true
      fail-on-violations:
        description: |
          true (default): the check fails when a changed file has an ERROR-level
          violation. Warnings never fail it -- they show as annotations only.
          false: report annotations but never fail the check.
        type: boolean
        required: false
        default: true

concurrency:
  group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint changed files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Plain git diff, not a third-party "changed files" action: one less
      # dependency running with this repo's token.
      - name: Find changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "Not a pull_request run; nothing to diff against."
            echo "php_count=0" >> "$GITHUB_OUTPUT"
            echo "js_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ACMR: skip deleted files -- there's nothing to lint in them.
          git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" > all-changed.txt
          # Vendored, built and generated code is not ours to lint.
          grep -vE '(^|/)(vendor|node_modules|build|dist|assets/(js|css)/.*\.min)/|\.min\.(js|css)$' all-changed.txt > candidates.txt || true
          grep -E '\.php$' candidates.txt > changed-php.txt || true
          grep -E '\.(js|jsx|ts|tsx|mjs|cjs)$' candidates.txt > changed-js.txt || true
          echo "php_count=$(wc -l < changed-php.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "js_count=$(wc -l < changed-js.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

          # Detect each tool's repo-owned config.
          if [ -f phpcs.xml ] || [ -f phpcs.xml.dist ] || [ -f .phpcs.xml ] || [ -f .phpcs.xml.dist ]; then
            echo "has_phpcs_config=true" >> "$GITHUB_OUTPUT"
          fi
          if ls .eslintrc* eslint.config.* >/dev/null 2>&1 || grep -q '"eslintConfig"' package.json 2>/dev/null; then
            echo "has_eslint_config=true" >> "$GITHUB_OUTPUT"
          fi

      # ---- PHPCS -------------------------------------------------------
      - name: Set up PHP
        if: inputs.run-phpcs && steps.changed.outputs.php_count != '0' && steps.changed.outputs.has_phpcs_config == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          tools: composer, cs2pr
          coverage: none

      - name: Install Composer dependencies
        if: inputs.run-phpcs && steps.changed.outputs.php_count != '0' && steps.changed.outputs.has_phpcs_config == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHPCS (changed files)
        if: inputs.run-phpcs && steps.changed.outputs.php_count != '0' && steps.changed.outputs.has_phpcs_config == 'true'
        env:
          FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        run: |
          echo "Linting $(wc -l < changed-php.txt | tr -d ' ') PHP file(s)"
          # cs2pr turns the checkstyle report into inline PR annotations.
          # --graceful-warnings: only ERRORS fail the step, warnings just annotate.
          vendor/bin/phpcs -q --report=checkstyle --file-list=changed-php.txt | cs2pr --graceful-warnings || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "$FAIL_ON_VIOLATIONS" != "true" ]; then
            echo "::notice::PHPCS found errors, but fail-on-violations is false."
            exit 0
          fi
          exit "${status:-0}"

      # ---- ESLint ------------------------------------------------------
      - name: Set up Node
        if: inputs.run-eslint && steps.changed.outputs.js_count != '0' && steps.changed.outputs.has_eslint_config == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install JS dependencies
        if: inputs.run-eslint && steps.changed.outputs.js_count != '0' && steps.changed.outputs.has_eslint_config == 'true'
        run: |
          # ESLint needs the repo's own plugins/configs installed. Pick the
          # package manager from the lockfile the repo actually committed.
          if   [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ];      then corepack enable && yarn install --frozen-lockfile
          else                             npm ci --no-audit --no-fund
          fi

      - name: ESLint (changed files)
        if: inputs.run-eslint && steps.changed.outputs.js_count != '0' && steps.changed.outputs.has_eslint_config == 'true'
        env:
          FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        run: |
          echo "Linting $(wc -l < changed-js.txt | tr -d ' ') JS/TS file(s)"
          # --no-error-on-unmatched-pattern: a changed file the config ignores is fine.
          xargs -a changed-js.txt npx --no-install eslint --no-error-on-unmatched-pattern || status=$?
          if [ "${status:-0}" -ne 0 ] && [ "$FAIL_ON_VIOLATIONS" != "true" ]; then
            echo "::notice::ESLint found errors, but fail-on-violations is false."
            exit 0
          fi
          exit "${status:-0}"

      - name: Summary
        if: always()
        env:
          PHP_COUNT: ${{ steps.changed.outputs.php_count }}
          JS_COUNT: ${{ steps.changed.outputs.js_count }}
          HAS_PHPCS: ${{ steps.changed.outputs.has_phpcs_config }}
          HAS_ESLINT: ${{ steps.changed.outputs.has_eslint_config }}
        run: |
          {
            echo "### Lint scope"
            echo "- PHP files changed: ${PHP_COUNT:-0} (PHPCS config: ${HAS_PHPCS:-none})"
            echo "- JS/TS files changed: ${JS_COUNT:-0} (ESLint config: ${HAS_ESLINT:-none})"
          } >> "$GITHUB_STEP_SUMMARY"
